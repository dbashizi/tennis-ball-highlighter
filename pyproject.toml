[project]
name = "tbh"
version = "0.1.0"
description = "Tennis ball highlighter: offline ball tracking + local helper service for the Chrome overlay"
requires-python = ">=3.12"
dependencies = [
  "numpy>=1.26",
  "opencv-python>=4.9",
  "torch>=2.4",
  "torchvision>=0.19",
  "scipy>=1.13",
  "yt-dlp>=2025.1.1",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pydantic>=2.7",
  "gdown>=5.2",
]

[project.scripts]
tbh = "tbh.pipeline.cli:main"
tbh-service = "tbh.service.app:main"

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tbh"]

[tool.pytest.ini_options]
testpaths = ["tests"]
